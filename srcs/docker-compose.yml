#version: "3.1"
---
services:
  nginx: 
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html:ro
      # - ./html:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    ports:
      - "9000:9000"
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception
    restart: on-failure

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - inception
    restart: on-failure
  
volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/gama/desktop/42ADMIS/cercle5/inceeption/data/wordpress
      o: bind
      type: none
  db:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/gama/desktop/42ADMIS/cercle5/inceeption/data/mariadb
      o: bind
      type: none

networks:
  inception: